name: Deploy Bot to VPS
on:
  push:
    branches: [ "main" ]
jobs:
  # JOB 1: Image bauen und zu Docker Hub pushen
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'corretto'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/telegram-tape-bot:latest

  # JOB 2: Auf dem VPS einloggen und neustarten
  deploy-to-vps:
    needs: build-and-push # Wartet, bis Job 1 fertig ist
    runs-on: ubuntu-latest
    steps:
      - name: Execute SSH Commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Diese Befehle werden auf deinem VPS ausgeführt
          script: |
            cd /etc/docker/container/telegram-bot
            docker compose pull bot
            docker compose up -d bot
            docker image prune -f